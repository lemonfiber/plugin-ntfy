# The plugin verdict on ntfy, from spec's first-party-plugin workflow (F3-R9, F5-R13), and every
# recording taken again by lemonfiber against the pinned ntfy (REPO-R93).
name: plugin
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  plugin:
    uses: lemonfiber/spec/.github/workflows/first-party-plugin.yml@628a1f51b42b212054e0cf70f6f77fd75f424a40 # v1.0.144
