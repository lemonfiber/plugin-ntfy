# CodeQL analysis of the workflows, the only code this plugin holds (Q-R53, Q-R80).
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 2"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  scope:
    name: what changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --no-renames --name-only "${BASE}" HEAD -- .github)"
          if [ -n "${changed}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:actions"

  alerts:
    needs: [scope, analyze]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      security-events: read
    uses: lemonfiber/spec/.github/workflows/codeql-alerts.yml@c39b30a096b2debc080e3d945b782dc67dc20a6c # v1.0.147
    with:
      analysis: ${{ needs.analyze.result }}
      code: ${{ needs.scope.result != 'success' || needs.scope.outputs.code != 'false' }}
